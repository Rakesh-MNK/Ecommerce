server:
  port: 8761

spring:
  application:
    name: EUREKASERVICE

# This service is the registry itself, so it does not register with itself.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
